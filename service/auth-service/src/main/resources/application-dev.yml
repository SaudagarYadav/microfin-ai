server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://dev-postgres.microfin.internal:5432/microfin_auth
    username: microfin_auth_dev
    password: microfin_auth_dev_pwd
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  security:
    oauth2:
      authorization-server:
        client:
          microfin-client:
            registration:
              client-id: microfin-client
              client-secret: "{noop}microfin-secret-dev"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - refresh_token
                - client_credentials
              redirect-uris:
                - "https://dev.microfin.internal/login/oauth2/code/microfin"
              post-logout-redirect-uris:
                - "https://dev.microfin.internal/"
              scopes:
                - openid
                - profile
                - read
                - write
            require-authorization-consent: true
            token:
              access-token-time-to-live: 15m
              refresh-token-time-to-live: 30d
              reuse-refresh-tokens: false

app:
  security:
    jwt:
      issuer: microfin-auth-service-dev
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 30
    cors:
      allowed-origins: https://dev.microfin.internal

logging:
  level:
    root: INFO
    com.microfin.auth: DEBUG
